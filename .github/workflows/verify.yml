name: Verify site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test verifier
        run: ./tests/verify-site.sh
      - name: Verify macOS terminal window
        run: ./tests/verify-terminal-window.sh
      - name: Verify managed terminal sequence
        run: ./tests/verify-managed-sequence.sh
      - name: Verify doctor terminal sequence
        run: ./tests/verify-doctor-sequence.sh
      - name: Verify fixed terminal motion
        run: ./tests/verify-terminal-motion.sh
      - name: Verify CSS-only theme picker
        run: ./tests/verify-theme-picker.sh
      - name: Verify public prerelease surface
        run: ./tests/verify-prerelease-public.sh
      - name: Verify production page
        if: ${{ hashFiles('index.html') != '' }}
        run: ./scripts/verify-site.sh index.html
