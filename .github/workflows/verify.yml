name: Verify site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test verifier
        run: ./tests/verify-site.sh
      - name: Verify macOS terminal window
        run: ./tests/verify-terminal-window.sh
      - name: Verify managed terminal sequence
        run: ./tests/verify-managed-sequence.sh
      - name: Verify production page
        if: ${{ hashFiles('index.html') != '' }}
        run: ./scripts/verify-site.sh index.html
